name: Build crmfrappe (bench + init)

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    tags: ["v*"]

concurrency:
  group: build-crmfrappe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "TAG1=${{ github.ref_name }}" >> $GITHUB_ENV
            echo "TAG2=stable" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "develop" ]]; then
            echo "TAG1=latest" >> $GITHUB_ENV
            echo "TAG2=nightly" >> $GITHUB_ENV
          else
            echo "TAG1=v15" >> $GITHUB_ENV
            echo "TAG2=stable" >> $GITHUB_ENV
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/crmfrappe:${{ env.TAG1 }}
            ${{ secrets.DOCKERHUB_USERNAME }}/crmfrappe:${{ env.TAG2 }}
            ${{ secrets.DOCKERHUB_USERNAME }}/crmfrappe:with-init
          cache-from: type=gha
          cache-to: type=gha,mode=max
