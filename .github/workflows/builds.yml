name: Build crmfrappe (Frappe Docker layered)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"

concurrency:
  group: build-crmfrappe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        arch: [amd64] # <-- deixa só amd64 por enquanto. quando estabilizar, coloca arm64

    steps:
      - name: Checkout Entire Repository
        uses: actions/checkout@v4

      # QEMU só é necessário se você for buildar arm64 em runner amd64
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/${{ matrix.arch }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Branch / Args
        shell: bash
        run: |
          APPS_JSON='[{"url": "https://github.com/${{ github.repository }}","branch": "${{ github.ref_name }}"}]'
          echo "APPS_JSON_BASE64=$(echo -n "$APPS_JSON" | base64 -w 0)" >> $GITHUB_ENV

          # Se estiver em tag ou main -> version-15, senão develop
          if [[ "${{ github.ref_type }}" == "tag" || "${{ github.ref_name }}" == "main" ]]; then
            echo "FRAPPE_BRANCH=version-15" >> $GITHUB_ENV
          else
            echo "FRAPPE_BRANCH=develop" >> $GITHUB_ENV
          fi

      - name: Set Image Tags
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" == "develop" ]]; then
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
            echo "STABLE_TAG=nightly" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=v15" >> $GITHUB_ENV
            echo "STABLE_TAG=stable" >> $GITHUB_ENV
          fi

      - name: Checkout frappe_docker build context
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: builds

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          context: builds
          file: builds/images/layered/Containerfile
          platforms: linux/${{ matrix.arch }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/crmfrappe:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/crmfrappe:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/crmfrappe:${{ env.STABLE_TAG }}
          build-args: |
            FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}
            APPS_JSON_BASE64=${{ env.APPS_JSON_BASE64 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
